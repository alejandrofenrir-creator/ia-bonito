    <style>
        :root {
            --bg-primary: #04060d;
            --bg-card: #0a1020;
            --bg-elevated: #111a30;
            --text-primary: #eaf0ff;
            --text-secondary: #8d9bb8;
            --accent-primary: #c6ff3d;
            --accent-secondary: #ffd66b;
            --accent-tertiary: #22e6ff;
            --accent-danger: #ff4d5e;
            --accent-purple: #a66bff;
            --accent-pink: #ff3fd0;
            --glow-primary: rgba(198,255,61,0.18);
            --glow-secondary: rgba(255,214,107,0.14);
            --line: rgba(255,255,255,0.08);
            --ink-on-accent: #04110a;
            --font-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            background-image:
                radial-gradient(900px 520px at 10% -8%, rgba(198,255,61,0.10), transparent 62%),
                radial-gradient(820px 520px at 96% -4%, rgba(34,230,255,0.09), transparent 62%),
                radial-gradient(760px 520px at 50% 112%, rgba(166,107,255,0.08), transparent 62%);
            background-attachment: fixed;
            color: var(--text-primary);
            margin: 0; padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
        }
        /* Trama diagonal de estadio, muy sutil */
        body::before {
            content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background: repeating-linear-gradient(115deg, rgba(255,255,255,0.02) 0 2px, transparent 2px 16px);
            -webkit-mask-image: linear-gradient(to bottom, #000, transparent 75%);
                    mask-image: linear-gradient(to bottom, #000, transparent 75%);
        }
        :focus-visible { outline: 2px solid var(--accent-primary); outline-offset: 2px; }

        .font-display, .fc-display { font-family: var(--font-display); }

        /* ===== Sidebar ===== */
        .sidebar {
            position: fixed; left: 0; top: 0; bottom: 0;
            width: 68px; background: linear-gradient(180deg, #070b16 0%, #04060d 100%);

            align-items: center; padding: 1rem 0;
            z-index: 60;

        .sidebar::after {
            content: ''; position: absolute; top: 0; right: -1px; width: 2px; height: 160px;
            background: linear-gradient(180deg, var(--accent-primary), transparent);
        }
        .sidebar-logo {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, #d9ff6b, var(--accent-primary) 55%, #8fd400);
            clip-path: polygon(0 0, 100% 0, 100% 68%, 68% 100%, 0 100%);
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 2rem; font-size: 1.1rem;
        }
        .sidebar-logo i { color: var(--ink-on-accent) !important; }
        .sidebar-nav { display: flex; flex-direction: column; gap: 0.4rem; flex: 1; }
        .sidebar-item {

        }
        .sidebar-item:hover { color: #fff; background: rgba(255,255,255,0.06); }
        .sidebar-item.active {
            color: var(--accent-primary);
            background: linear-gradient(90deg, rgba(198,255,61,0.18), rgba(198,255,61,0.02));
        }
        .sidebar-item.active::before {
            content: ''; position: absolute; left: -11px;
            width: 4px; height: 28px; border-radius: 0 3px 3px 0;
            background: var(--accent-primary);
            box-shadow: 0 0 14px rgba(198,255,61,0.7);
        }
        .sidebar-bottom {
            margin-top: auto; display: flex; flex-direction: column;

        }

        @media (max-width: 768px) {

        /* ===== Hero ===== */
        .hero-banner {
            position: relative; width: 100%; height: 220px;
            overflow: hidden; border-bottom: 1px solid var(--line);
        }
        .hero-banner img {

            filter: brightness(0.38) saturate(1.25);
        }
        .hero-banner::after {
            content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-tertiary) 55%, transparent);
        }
        .hero-overlay {
            position: absolute; inset: 0;
            background:
                linear-gradient(to top, var(--bg-primary) 0%, transparent 62%),
                linear-gradient(100deg, rgba(4,6,13,0.92) 0%, rgba(4,6,13,0.35) 58%, transparent 100%);
            display: flex; align-items: flex-end;
            padding: 2rem;

        .hero-overlay::before {
            content: ''; position: absolute; top: 0; bottom: 0; left: 3%; width: 38%;

        .hero-title span { color: var(--accent-primary); }
        .hero-subtitle {
            position: relative; display: flex; align-items: center; gap: 0.6rem;

            font-weight: 700; letter-spacing: 0.28em;
            text-transform: uppercase; margin-top: 0.5rem;

        .hero-subtitle::before { content: ''; width: 28px; height: 3px; background: var(--accent-primary); }
        .hero-stats {

            font-size: 2.3rem; font-weight: 900; line-height: 1; color: #fff;
        }
        .hero-stat-label {
            font-size: 0.62rem; color: var(--accent-primary);
            text-transform: uppercase; font-weight: 800;
            letter-spacing: 0.18em; margin-top: 0.15rem;
        }
        @media (max-width: 768px) {
            .hero-banner { height: 150px; }
            .hero-overlay { padding: 1.25rem; }
            .hero-title { font-size: 2.4rem; }
            .hero-stats { display: none; }
        }

        /* ===== Navegación móvil ===== */
        .mobile-nav {
            display: none;
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(4,6,13,0.94);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--line);
            padding: 0.4rem 0.5rem calc(0.4rem + env(safe-area-inset-bottom));
            z-index: 60;
            justify-content: space-around;
        }
        .mobile-nav-item {
            position: relative;
            display: flex; flex-direction: column;
            align-items: center; gap: 0.15rem;
            color: var(--text-secondary); font-size: 0.62rem;
            font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
            padding: 0.45rem 0.8rem; border-radius: 6px;
            transition: color 0.2s;
        }
        .mobile-nav-item i { font-size: 1.1rem; }
        .mobile-nav-item.active { color: var(--accent-primary); }
        .mobile-nav-item.active::before {
            content: ''; position: absolute; top: -0.4rem; left: 20%; right: 20%; height: 3px;
            background: var(--accent-primary); box-shadow: 0 0 12px rgba(198,255,61,0.7);
        }

        /* ===== Superficies y controles ===== */
        .ios-card {
            position: relative;
            background-color: rgba(12,19,38,0.92);
            border-radius: 6px;
            border: 1px solid var(--line);
            box-shadow: 0 10px 30px rgba(0,0,0,0.45);
        }
        .ios-card::before {
            content: ''; position: absolute; top: -1px; left: -1px; width: 22px; height: 22px;
            border-top: 2px solid var(--accent-primary); border-left: 2px solid var(--accent-primary);
            border-top-left-radius: 6px; pointer-events: none;
        }

        .ios-input {
            background: rgba(6,10,22,0.85);
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.12);
            padding: 0.65rem 0.9rem;
            font-size: 0.9rem;
            color: #fff;
            width: 100%;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }
        .ios-input::placeholder { color: rgba(141,155,184,0.7); }
        .ios-input:focus { outline: none; border-color: var(--accent-primary); background: rgba(198,255,61,0.05); box-shadow: 0 0 0 3px rgba(198,255,61,0.16); }
        .ios-input:disabled { opacity: 0.5; cursor: not-allowed; }

        .ios-btn {
            background: linear-gradient(135deg, #d9ff6b 0%, var(--accent-primary) 45%, #9be000 100%);
            color: var(--ink-on-accent);
            font-family: var(--font-display); font-weight: 800; font-style: italic;
            text-transform: uppercase; letter-spacing: 0.06em; font-size: 1.05rem;
            padding: 0.75rem 1.6rem; border: none; cursor: pointer;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 11px), calc(100% - 11px) 100%, 0 100%);
            transition: transform 0.15s, filter 0.2s;
            position: relative; overflow: hidden;
        }
        .ios-btn::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.55) 50%, transparent 70%);
            transform: translateX(-120%); transition: transform 0.55s;
        }
        .ios-btn:hover:not(:disabled) { filter: brightness(1.08) saturate(1.1); transform: translateY(-1px); }
        .ios-btn:hover:not(:disabled)::after { transform: translateX(120%); }
        .ios-btn:active:not(:disabled) { transform: scale(0.98); }
        .ios-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .ios-btn-secondary {
            background: rgba(255,255,255,0.04); color: #fff;
            border: 1px solid rgba(255,255,255,0.18);
            font-family: var(--font-display); font-weight: 700; font-style: italic;
            text-transform: uppercase; letter-spacing: 0.06em; font-size: 1.05rem;
            border-radius: 4px; padding: 0.75rem 1.5rem; cursor: pointer;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
        }
        .ios-btn-secondary:hover { background: rgba(198,255,61,0.08); border-color: var(--accent-primary); color: var(--accent-primary); }

        .segmented-control {
            background: rgba(255,255,255,0.04); padding: 0.25rem;
            border-radius: 4px; display: flex; overflow-x: auto;
            scrollbar-width: none; border: 1px solid var(--line);

        .segmented-control::-webkit-scrollbar { display: none; }
        .segment-btn {
            flex: 1; min-width: 70px; text-align: center;
            padding: 0.5rem 0.6rem; font-size: 0.78rem; font-weight: 800; letter-spacing: 0.04em;
            color: rgba(255,255,255,0.5); border-radius: 3px;
            cursor: pointer; white-space: nowrap;
            transition: color 0.2s, background 0.2s; user-select: none;
        }
        .segment-btn:hover { color: #fff; }
        .segment-btn.active { color: var(--ink-on-accent); background: var(--accent-primary); }

        .glass-header {
            background: rgba(4,6,13,0.8);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--line);
        }

        /* ===== Rejilla de tarjetas ===== */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(176px, 1fr));
            gap: 1.5rem 1.25rem;
            justify-items: center;
            padding: 1rem 0;
        }
        @media (max-width: 640px) {
            .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem 0.75rem; }
        }

        /* ===== TARJETA DE JUGADOR (estilo FC 27) ===== */
        .fc-card {
            --rim-a: #fff0b0; --rim-b: #b98724;
            --body-a: #f3d676; --body-b: #a97a1c;
            --ink: #2b1c00; --ink-soft: rgba(43,28,0,0.62);
            position: relative; width: 100%; max-width: 232px;
            aspect-ratio: 5 / 7.1;
            container-type: inline-size;
            cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
            color: var(--ink);
            filter: drop-shadow(0 12px 18px rgba(0,0,0,0.55));
            transform: perspective(800px) rotateX(var(--ry, 0deg)) rotateY(var(--rx, 0deg));
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.3s;
            will-change: transform;
        }
        .fc-card:hover {
            transform: perspective(800px) rotateX(var(--ry, 0deg)) rotateY(var(--rx, 0deg)) translateY(-5px) scale(1.035);
            transition: transform 0.08s linear, filter 0.3s;
            filter: drop-shadow(0 18px 26px rgba(0,0,0,0.65)) drop-shadow(0 0 14px var(--glow, rgba(255,214,107,0.35)));
        }
        .fc-card:focus-visible { outline: none; filter: drop-shadow(0 0 0 #000) drop-shadow(0 0 3px var(--accent-primary)) drop-shadow(0 0 12px var(--accent-primary)); }

        .fc-shape, .fc-shape::before {
            position: absolute; inset: 0;
            clip-path: polygon(10% 0%, 90% 0%, 100% 4.5%, 100% 88%, 50% 100%, 0% 88%, 0% 4.5%);
        }
        .fc-shape { background: linear-gradient(155deg, var(--rim-a), var(--rim-b)); overflow: hidden; }
        .fc-shape::before {
            content: ''; inset: 2.4cqw;
            background:
                radial-gradient(90% 60% at 72% 12%, rgba(255,255,255,0.35), transparent 60%),
                linear-gradient(170deg, var(--body-a), var(--body-b));
        }
        .fc-foil, .fc-shine { position: absolute; inset: 0; pointer-events: none; clip-path: inherit; }
        .fc-foil {
            inset: 2.4cqw;
            background:
                repeating-linear-gradient(125deg, rgba(255,255,255,0.07) 0 1.2cqw, transparent 1.2cqw 3.6cqw);
            mix-blend-mode: soft-light;
        }
        .fc-shine {
            background: radial-gradient(circle at var(--mx, 30%) var(--my, 15%), rgba(255,255,255,0.55), transparent 42%);
            mix-blend-mode: overlay; opacity: 0; transition: opacity 0.25s;
        }
        .fc-card:hover .fc-shine { opacity: 1; }

        .fc-photo {
            position: absolute; top: 8cqw; right: 7cqw; width: 60cqw; height: 56cqw;
            display: flex; align-items: flex-end; justify-content: center; overflow: hidden;
            -webkit-mask-image: radial-gradient(ellipse 58% 60% at 50% 42%, #000 58%, transparent 100%);
                    mask-image: radial-gradient(ellipse 58% 60% at 50% 42%, #000 58%, transparent 100%);
        }
        .fc-photo img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
        .fc-photo i { font-size: 34cqw; color: var(--ink-soft); opacity: 0.45; }

        .fc-left {
            position: absolute; top: 10cqw; left: 11cqw; width: 22cqw;
            display: flex; flex-direction: column; align-items: center; text-align: center;
        }
        .fc-rating { font-family: var(--font-display); font-weight: 800; font-size: 25cqw; line-height: 0.82; letter-spacing: -0.01em; }
        .fc-pos { font-family: var(--font-display); font-weight: 700; font-size: 10.5cqw; line-height: 1; margin-top: 1.2cqw; letter-spacing: 0.04em; text-transform: uppercase; }
        .fc-sep { width: 13cqw; height: 0.7cqw; background: currentColor; opacity: 0.35; margin: 3cqw 0; }
        .fc-arch { font-size: 9cqw; opacity: 0.8; }

        .fc-name {
            position: absolute; top: 64cqw; left: 8cqw; right: 8cqw; text-align: center;
            font-family: var(--font-display); font-weight: 800; font-size: 10.5cqw; line-height: 1.1; letter-spacing: 0.03em;
            text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            padding-bottom: 1.4cqw; border-bottom: 0.7cqw solid color-mix(in srgb, currentColor 30%, transparent);
        }
        .fc-stats {
            position: absolute; top: 78.5cqw; left: 17cqw; right: 17cqw;
            display: grid; grid-template-columns: 1fr 1fr; column-gap: 7cqw; row-gap: 0;
        }
        .fc-stats::before {
            content: ''; position: absolute; left: 50%; top: 1cqw; bottom: 1cqw; width: 0.7cqw;
            background: currentColor; opacity: 0.22; transform: translateX(-50%);
        }
        .fc-stat { display: flex; align-items: baseline; justify-content: center; gap: 2cqw; font-family: var(--font-display); line-height: 1.05; }
        .fc-stat b { font-weight: 800; font-size: 10cqw; }
        .fc-stat span { font-weight: 600; font-size: 7.6cqw; opacity: 0.72; letter-spacing: 0.03em; }
        .fc-foot {
            position: absolute; top: 113cqw; left: 0; right: 0;
            display: flex; justify-content: center; gap: 4.5cqw;
            font-size: 6.2cqw; font-weight: 800; letter-spacing: 0.06em; color: var(--ink-soft);
        }
        .fc-foot b { color: var(--ink); margin: 0 0.6cqw 0 1cqw; }
        .fc-foot i { font-size: 5.2cqw; }

        .fc-card.rarity-bronze { --rim-a: #f0c598; --rim-b: #7b4a22; --body-a: #d29761; --body-b: #85512a; --ink: #2a1608; --ink-soft: rgba(42,22,8,0.62); --glow: rgba(210,151,97,0.4); }
        .fc-card.rarity-silver { --rim-a: #ffffff; --rim-b: #8d9bb0; --body-a: #dbe3ee; --body-b: #8996ab; --ink: #111a2a; --ink-soft: rgba(17,26,42,0.6); --glow: rgba(200,215,235,0.4); }
        .fc-card.rarity-gold   { --rim-a: #fff3b8; --rim-b: #c4902a; --body-a: #f6d878; --body-b: #ac7c1b; --ink: #2b1c00; --ink-soft: rgba(43,28,0,0.62); --glow: rgba(255,214,107,0.45); }

        /* Holográfica: la rareza top (OVR 85+) */
        .fc-card.rarity-holo {
            --rim-a: #22e6ff; --rim-b: #ff3fd0;
            --body-a: #1b1f5e; --body-b: #070a24;
            --ink: #ffffff; --ink-soft: rgba(255,255,255,0.7); --glow: rgba(34,230,255,0.55);
        }
        .fc-card.rarity-holo .fc-shape { background: conic-gradient(from 210deg at 50% 50%, #22e6ff, #8b5cf6, #ff3fd0, #ffd66b, #c6ff3d, #22e6ff); }
        .fc-card.rarity-holo .fc-shape::before {
            background:
                radial-gradient(70% 45% at 78% 8%, rgba(34,230,255,0.45), transparent 65%),
                radial-gradient(60% 40% at 8% 70%, rgba(255,63,208,0.28), transparent 70%),
                linear-gradient(170deg, var(--body-a), var(--body-b));
        }
        .fc-card.rarity-holo .fc-foil {
            background:
                linear-gradient(115deg, transparent 18%, rgba(34,230,255,0.5) 34%, rgba(255,63,208,0.5) 50%, rgba(255,214,107,0.5) 66%, transparent 82%);
            background-size: 260% 100%; background-position: var(--sx, 0%) 0;
            mix-blend-mode: color-dodge; opacity: 0.55;

        // Lee la sesión desde el token (el rol viene firmado en el token, no de un valor editable).
        const getSession = () => {
            try {
                const t = localStorage.getItem('jogga_token');
                if (!t) return null;
                const b64 = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
                const payload = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0))));
                if (!payload.exp || payload.exp * 1000 <= Date.now()) return null;
                return payload;
            } catch { return null; }
        };
        const getRole = () => { const s = getSession(); return s ? s.role : null; };
        const clearSession = () => { localStorage.removeItem('jogga_token'); localStorage.removeItem('jogga_role'); };
        const notify = (msg) => window.dispatchEvent(new CustomEvent(TOAST_EVENT, { detail: msg }));

        // fetch con token; si el servidor responde 401 la sesión caducó y se vuelve al login.
        const apiFetch = async (url, options = {}) => {
            const headers = { ...(options.headers || {}) };
            const token = localStorage.getItem('jogga_token');
            if (token) headers['Authorization'] = `Bearer ${token}`;
            if (options.body !== undefined && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
            const res = await fetch(url, { ...options, headers });
            if (res.status === 401) { clearSession(); window.dispatchEvent(new Event(AUTH_EXPIRED_EVENT)); }
            return res;
        };

        // Reduce y recomprime una imagen (JPEG) antes de enviarla; Vercel rechaza cuerpos de más de 4,5 MB.
        const compressImage = (file, maxSide = 1600, quality = 0.85) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onerror = () => reject(new Error('No se pudo leer la imagen'));
            reader.onload = () => {
                const img = new Image();
                img.onerror = () => reject(new Error('Imagen inválida'));
                img.onload = () => {
                    const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.max(1, Math.round(img.width * scale));
                    canvas.height = Math.max(1, Math.round(img.height * scale));
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
        });

            "5-3-2": { name: "5-3-2", pos: [{t:92,l:50,p:'POR'},{t:76,l:8,p:'CAI'},{t:78,l:28,p:'DFC'},{t:78,l:50,p:'DFC'},{t:78,l:72,p:'DFC'},{t:76,l:92,p:'CAD'},{t:55,l:25,p:'MC'},{t:55,l:50,p:'MC'},{t:55,l:75,p:'MC'},{t:22,l:35,p:'DC'},{t:22,l:65,p:'DC'}] },
            "4-1-4-1": { name: "4-1-4-1", pos: [{t:92,l:50,p:'POR'},{t:76,l:12,p:'LI'},{t:76,l:37,p:'DFC'},{t:76,l:63,p:'DFC'},{t:76,l:88,p:'LD'},{t:62,l:50,p:'MCD'},{t:45,l:12,p:'MI'},{t:45,l:37,p:'MC'},{t:45,l:63,p:'MC'},{t:45,l:88,p:'MD'},{t:18,l:50,p:'DC'}] },
        };

        const ARCHETYPES = {
            "Spark": { role: "Desequilibrante", icon: "fa-bolt", bg: "bg-blue-900 text-blue-200 border-blue-500" },
            "Finisher": { role: "Goleador Letal", icon: "fa-crosshairs", bg: "bg-green-900 text-green-200 border-green-500" },
            "Target": { role: "Faro Ofensivo", icon: "fa-bullseye", bg: "bg-orange-900 text-orange-200 border-orange-500" },
            "Maestro": { role: "Director de Orquesta", icon: "fa-wand-magic-sparkles", bg: "bg-purple-900 text-purple-200 border-purple-500" },
            "Box2Box": { role: "Motor del Equipo", icon: "fa-arrows-up-down", bg: "bg-teal-900 text-teal-200 border-teal-500" },
            "Recycler": { role: "Destructor", icon: "fa-shield-halved", bg: "bg-gray-800 text-gray-200 border-gray-500" },
            "Boss": { role: "Líder Defensivo", icon: "fa-chess-rook", bg: "bg-indigo-900 text-indigo-200 border-indigo-500" },
            "Marauder": { role: "Carrilero Ofensivo", icon: "fa-person-running", bg: "bg-pink-900 text-pink-200 border-pink-500" },
            "Wall": { role: "Portero", icon: "fa-hand", bg: "bg-cyan-900 text-cyan-200 border-cyan-500" }
        };

        const DEFAULT_ATTRS = (() => {
            const a = {};
            Object.keys(DETAILED_STATS).forEach(g => { a[g]={}; Object.keys(DETAILED_STATS[g].fields).forEach(f => a[g][f] = 75); });
            return a;
        })();

        const getDefaultAttrs = () => JSON.parse(JSON.stringify(DEFAULT_ATTRS));

        const calcMainStats = (attrs) => {
            const res = {};
            Object.keys(attrs).forEach(g => {
                const vals = Object.values(attrs[g]).map(v => parseInt(v)||0);
                res[g] = Math.round(vals.reduce((a,b)=>a+b,0) / (vals.length||1));
            });
            return res;
        };

        const getOvrClass = (ovr) => ovr >= 85 ? 'ovr-elite' : ovr >= 75 ? 'ovr-good' : ovr >= 65 ? 'ovr-avg' : 'ovr-low';

        const analyzePosition = (posData) => {
            const { pac, sho, pas, dri, def, phy } = calcMainStats(posData.attributes);
            const pos = posData.position;
            let archetype="Box2Box", role="Jugador", ovr=0;
            if (pos === 'POR') { ovr = Math.round(def*0.3+phy*0.25+pac*0.15+pas*0.15+sho*0.05+dri*0.1); archetype="Wall"; role="Guardameta"; }
            else if (POS_GROUPS.attack.includes(pos)) {
                ovr = Math.round(pac*0.2+sho*0.25+pas*0.1+dri*0.25+def*0.05+phy*0.15);
                if(pac>84 && dri>81) { archetype="Spark"; role="Extremo/Media Punta"; }
                else if(sho>84 && phy>77) { archetype="Target"; role="Hombre Objetivo"; }
                else if(sho>80) { archetype="Finisher"; role="Cazagoles"; }
                else { archetype="Spark"; role="Móvil"; }
            } else if (POS_GROUPS.midfield.includes(pos)) {
                ovr = Math.round(pac*0.1+sho*0.1+pas*0.25+dri*0.2+def*0.15+phy*0.2);
                if(pas>84 && dri>79) { archetype="Maestro"; role="Playmaker"; }
                else if(def>79 && phy>77) { archetype="Recycler"; role="Pivote"; }
                else { archetype="Box2Box"; role="Todoterreno"; }
            } else {
                ovr = Math.round(pac*0.15+sho*0.02+pas*0.1+dri*0.08+def*0.35+phy*0.3);
                if(['LI','LD','CAI','CAD'].includes(pos)) { archetype = pac>83?"Marauder":"Boss"; role = pac>83?"Carrilero":"Defensor Cierre"; }
                else { archetype="Boss"; role="Central Marcador"; }
            }
            return { archetype, role, ovr: Math.min(99, Math.max(1, ovr)), archData: ARCHETYPES[archetype] };
        };

        // ===== IMPORTAR JUGADOR (validación) =====
        const clampInt = (v, min, max, def) => { const n = parseInt(v, 10); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : def; };
        const cleanStr = (v, max) => (typeof v === 'string' ? v.slice(0, max) : '');
        const sanitizeImportedPlayer = (raw) => {
            if (!raw || typeof raw !== 'object' || typeof raw.name !== 'string' || !raw.name.trim()) throw new Error('Formato inválido');
            if (!Array.isArray(raw.positions) || raw.positions.length === 0 || raw.positions.length > 15) throw new Error('Formato inválido');
            const positions = raw.positions.map(p => {
                if (!p || !POSITIONS.includes(p.position)) throw new Error('Posición inválida');
                const attributes = getDefaultAttrs();
                Object.keys(attributes).forEach(g => Object.keys(attributes[g]).forEach(f => {
                    attributes[g][f] = clampInt(p.attributes && p.attributes[g] && p.attributes[g][f], 1, 99, 75);
                }));
                const clean = {
                    position: p.position,
                    notes: cleanStr(p.notes, 1000),
                    rating: clampInt(p.rating, 0, 5, 0),
                    pros: cleanStr(p.pros, 500),
                    cons: cleanStr(p.cons, 500),
                    psGold: Array.isArray(p.psGold) ? p.psGold.filter(x => ALL_PLAYSTYLES.includes(x)).slice(0, 4) : [],
                    psSilver: Array.isArray(p.psSilver) ? p.psSilver.filter(x => ALL_PLAYSTYLES.includes(x)).slice(0, 10) : [],
                    attributes
                };
                return { ...clean, report: analyzePosition(clean) };
            });
            const photo = (typeof raw.photo === 'string' && raw.photo.startsWith('data:image/') && raw.photo.length <= 400000) ? raw.photo : null;
            return {
                name: raw.name.trim().slice(0, 60),
                photo,
                skillMoves: clampInt(raw.skillMoves, 1, 5, 3),
                weakFoot: clampInt(raw.weakFoot, 1, 5, 3),
                positions
            };
        };

        // ===== HOOKS =====
        const PLAYERS_KEY = 'jogga-players-v42';
        const useLocalStorage = (key, init) => {
            const [val, setVal] = useState(() => { try { const i = localStorage.getItem(key); return i ? JSON.parse(i) : init; } catch { return init; } });
            const valRef = useRef(val);
            const versionRef = useRef(0);      // versión de la plantilla en el servidor
            const syncedRef = useRef(key !== PLAYERS_KEY);
            const debounceRef = useRef(null);

            const cache = (nv) => { try { localStorage.setItem(key, JSON.stringify(nv)); } catch(e) { console.warn('localStorage full', e); } };
            const adopt = (nv) => { valRef.current = nv; setVal(nv); cache(nv); };

            // Al abrir: trae la plantilla del servidor (también cuando está vacía).
            useEffect(() => {
                if (key !== PLAYERS_KEY) return;
                let cancelled = false;
                apiFetch('/api/players').then(r => r.ok ? r.json() : null).then(data => {
                    if (cancelled || !data) return;
                    versionRef.current = Number.isInteger(data.version) ? data.version : 0;
                    if (Array.isArray(data.players)) adopt(data.players);
                }).catch(e => console.error('Error fetching from DB', e)).finally(() => { syncedRef.current = true; });
                return () => { cancelled = true; };
            }, [key]);

            useEffect(() => () => { if (debounceRef.current) clearTimeout(debounceRef.current); }, []);

            const persist = useCallback(async () => {
                if (!syncedRef.current) { debounceRef.current = setTimeout(persist, 1000); return; }
                const role = getRole();
                if (role !== 'admin' && role !== 'capitan') {
                    if (!window.__joggaReadOnlyWarned) { window.__joggaReadOnlyWarned = true; notify('Tu rol solo permite consultar la plantilla: los cambios no se guardan en el servidor.'); }
                    return;
                }
                try {
                    const res = await apiFetch('/api/players', { method: 'POST', body: JSON.stringify({ players: valRef.current, baseVersion: versionRef.current }) });
                    const data = await res.json().catch(() => ({}));
                    if (res.ok) { versionRef.current = data.version; return; }
                    if (res.status === 409) {
                        versionRef.current = Number.isInteger(data.version) ? data.version : versionRef.current;
                        if (Array.isArray(data.players)) adopt(data.players);
                        notify('⚠️ Otra persona actualizó la plantilla. Se cargó la última versión: repite tu cambio.');
                    } else if (res.status !== 401) {
                        notify(data.error ? `No se pudo guardar: ${data.error}` : 'No se pudo guardar la plantilla en el servidor.');
                    }
                } catch (e) { console.error('Error saving to DB', e); notify('Sin conexión: los cambios solo quedaron en este dispositivo.'); }
            }, [key]);

            const set = useCallback((v) => {
                const nv = v instanceof Function ? v(valRef.current) : v;
                valRef.current = nv;
                setVal(nv);
                cache(nv);
                if (key === PLAYERS_KEY) {
                    if (debounceRef.current) clearTimeout(debounceRef.current);
                    debounceRef.current = setTimeout(persist, 2000);
                }
            }, [key, persist]);
            return [val, set];
        };

        // ===== COMPONENTS =====
        const Toast = memo(({ msg, show }) => (
            <div className={`toast ${show?'show':''}`}>
                <div className="px-5 py-3 flex items-center gap-3 shadow-lg rounded-2xl border" style={{background:'var(--bg-card)', borderColor:'var(--bg-elevated)'}}>
                    <i className="fas fa-check-circle text-emerald-500 text-lg"></i>
                    <span className="text-sm font-bold" style={{color:'var(--text-primary)'}}>{msg}</span>
                </div>
            </div>
        ));

        const InputGroup = memo(({ label, children }) => (
            <div className="mb-3">
                <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1.5 ml-1">{label}</label>
                {children}
            </div>
        ));

        const TypingIndicator = memo(() => (
            <div className="flex justify-start">
                <div className="chat-bubble chat-bubble-ai flex items-center gap-1 py-3 px-4">
                    <span className="typing-dot"></span>
                    <span className="typing-dot"></span>
                    <span className="typing-dot"></span>
                </div>
            </div>
        ));

        const StatBar = memo(({ value, color }) => (
            <div className="stat-bar">
                <div className="stat-bar-fill" style={{ width: `${Math.min(99, Math.max(1, value))}%`, background: color }}></div>
            </div>
        ));

        const Stars = memo(({ count, max = 5, size = 'text-[8px]' }) => (
            <span className={`${size} flex gap-0.5`}>
                {Array.from({length: max}, (_, i) => (
                    <i key={i} className={`fas fa-star ${i < count ? 'text-yellow-400' : 'text-white/15'}`}></i>
                ))}
            </span>
        ));

        // SVG Radar Chart
        const RadarChart = memo(({ stats, size = 64 }) => {
            const keys = ['pac', 'sho', 'pas', 'dri', 'def', 'phy'];
            const cx = size / 2, cy = size / 2, r = size / 2 - 4;
            const angleStep = (Math.PI * 2) / 6;
            
            const getPoint = (index, value) => {
                const angle = angleStep * index - Math.PI / 2;
                const dist = (value / 99) * r;
                return [cx + dist * Math.cos(angle), cy + dist * Math.sin(angle)];
            };
            
            const bgPoints = keys.map((_, i) => getPoint(i, 99).join(',')).join(' ');
            const midPoints = keys.map((_, i) => getPoint(i, 50).join(',')).join(' ');
            const dataPoints = keys.map((k, i) => getPoint(i, stats[k] || 50).join(',')).join(' ');
            
            return (
                <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
                    <polygon points={bgPoints} fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth="1" />
                    <polygon points={midPoints} fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth="0.5" />
                    {keys.map((_, i) => {
                        const [x, y] = getPoint(i, 99);
                        return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke="rgba(255,255,255,0.05)" strokeWidth="0.5" />;
                    })}
                    <polygon points={dataPoints} fill="rgba(198,255,61,0.22)" stroke="#c6ff3d" strokeWidth="1.5" strokeLinejoin="round" />
                </svg>
            );
        });

        // ===== TARJETA DE JUGADOR (estilo FC 27) =====
        // Rareza según OVR: 85+ holográfica, 75+ oro, 65+ plata, resto bronce.
        const rarityOf = (ovr) => ovr >= 85 ? 'holo' : ovr >= 75 ? 'gold' : ovr >= 65 ? 'silver' : 'bronze';
        const CARD_STATS = [['pac','RIT'],['dri','REG'],['sho','TIR'],['def','DEF'],['pas','PAS'],['phy','FIS']];
        const PlayerCard = memo(({ player, posIndex = 0, onClick }) => {
            const pos = player.positions[posIndex];
            if (!pos) return null;
            const stats = calcMainStats(pos.attributes);
            const ovr = pos.report.ovr;

            // Inclinación y brillo holográfico que siguen al puntero (solo CSS vars, sin re-render).
            const onMove = (e) => {
                const el = e.currentTarget, r = el.getBoundingClientRect();
                const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
                el.style.setProperty('--mx', `${(x * 100).toFixed(1)}%`);
                el.style.setProperty('--my', `${(y * 100).toFixed(1)}%`);
                el.style.setProperty('--sx', `${(x * 100).toFixed(1)}%`);
                el.style.setProperty('--rx', `${((x - 0.5) * 14).toFixed(1)}deg`);
                el.style.setProperty('--ry', `${(-(y - 0.5) * 14).toFixed(1)}deg`);
            };
            const onLeave = (e) => { e.currentTarget.style.removeProperty('--rx'); e.currentTarget.style.removeProperty('--ry'); };

            return (
                <div className={`fc-card rarity-${rarityOf(ovr)}`} role="button" tabIndex={0}
                     aria-label={`${player.name}, ${ovr}, ${pos.position}`}
                     onClick={() => onClick(player)}
                     onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onClick(player); } }}
                     onMouseMove={onMove} onMouseLeave={onLeave}>
                    <div className="fc-shape"><div className="fc-foil"></div><div className="fc-shine"></div></div>
                    <div className="fc-photo">
                        {player.photo ? <img src={player.photo} alt="" loading="lazy" /> : <i className="fas fa-user"></i>}
                    </div>
                    <div className="fc-left">
                        <div className="fc-rating">{ovr}</div>
                        <div className="fc-pos">{pos.position}</div>
                        <div className="fc-sep"></div>
                        <i className={`fas ${pos.report.archData.icon} fc-arch`} title={pos.report.archetype}></i>
                    </div>
                    <div className="fc-name">{player.name}</div>
                    <div className="fc-stats">
                        {CARD_STATS.map(([k, label]) => (
                            <div key={k} className="fc-stat"><b>{stats[k]}</b><span>{label}</span></div>
                        ))}
                    </div>
                    <div className="fc-foot">
                        <span>SM<b>{player.skillMoves}</b><i className="fas fa-star"></i></span>
                        <span>PM<b>{player.weakFoot}</b><i className="fas fa-star"></i></span>
                        {pos.psGold.length > 0 && <span title="PlayStyles+"><i className="fas fa-bolt"></i><b>{pos.psGold.length}</b></span>}
                    </div>
                </div>
            );
        });

        // Hero Banner Component
        const HeroBanner = memo(({ players }) => {
            const avgOvr = players.length > 0 ? Math.round(players.reduce((sum, p) => sum + Math.max(...p.positions.map(pos => pos.report.ovr)), 0) / players.length) : 0;
            return (
                <div className="hero-banner">
                    <img src="fondo.jpg" alt="Stadium" />
                    <div className="hero-overlay">
                        <div>
                            <div className="hero-title">JOGGA <span>BONITO</span></div>
                            <div className="hero-subtitle">Squad Hub · Pro Clubs</div>
                        </div>
                        <div className="hero-stats">
                            <div className="hero-stat-item">
                                <div className="hero-stat-value">{players.length}</div>
                                <div className="hero-stat-label">Jugadores</div>
                            </div>
                            <div className="hero-stat-item">
                                <div className="hero-stat-value">{avgOvr}</div>
                                <div className="hero-stat-label">Media OVR</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        });

        // Sidebar Component
        const Sidebar = memo(({ activeTab, setActiveTab, role, onLogout }) => {
            const tabs = [
                {id:'squad',i:'fa-id-card',title:'Plantilla'},
                {id:'scouting',i:'fa-user-plus',title:'Scouting'},
                {id:'tactics',i:'fa-chess-board',title:'Táctica'},
                {id:'chat',i:'fa-robot',title:'IA Chat'},
                ...(role === 'admin' ? [{id:'admin',i:'fa-user-shield',title:'Admin'}] : [])
            ];
            
            return (
                <div className="sidebar">
                    <div className="sidebar-logo"><i className="fas fa-futbol text-white"></i></div>
                    <div className="sidebar-nav">
                        {tabs.map(t => (
                            <div key={t.id} className={`sidebar-item ${activeTab === t.id ? 'active' : ''}`} onClick={() => setActiveTab(t.id)} title={t.title}>
                                <i className={`fas ${t.i}`}></i>
                            </div>
                        ))}
                    </div>
                    <div className="sidebar-bottom">
                        <div className="sidebar-item" onClick={onLogout} title="Cerrar sesión">
                            <i className="fas fa-sign-out-alt"></i>
                        </div>
                    </div>
                </div>
            );
        });

        // Mobile Nav Component
        const MobileNav = memo(({ activeTab, setActiveTab, role }) => {
            const tabs = [
                {id:'squad',i:'fa-id-card',title:'Plantilla'},
                {id:'scouting',i:'fa-user-plus',title:'Scouting'},
                {id:'tactics',i:'fa-chess-board',title:'Táctica'},
                {id:'chat',i:'fa-robot',title:'Chat'},
                ...(role === 'admin' ? [{id:'admin',i:'fa-user-shield',title:'Admin'}] : [])
            ];
            
            return (
                <div className="mobile-nav">
                    {tabs.map(t => (
                        <div key={t.id} className={`mobile-nav-item ${activeTab === t.id ? 'active' : ''}`} onClick={() => setActiveTab(t.id)}>
                            <i className={`fas ${t.i}`}></i>
                            <span>{t.title}</span>
                        </div>
                    ))}
                </div>
            );
        });

        // ===== PLAYER DETAIL MODAL =====
        const PlayerDetailModal = memo(({ player, onClose, onEdit, onAddPos, onDelete, onExport }) => {
            if (!player) return null;
            const [activePosIdx, setActivePosIdx] = useState(0);
            const pos = player.positions[activePosIdx];
            const stats = calcMainStats(pos.attributes);
            const ovr = pos.report.ovr;

            return (
                <div className="modal-backdrop" onClick={onClose}>
                    <div className="modal-content" onClick={e => e.stopPropagation()}>
                        {/* Header */}
                        <div className="modal-head p-5 border-b border-white/5">
                            <div className="flex justify-between items-start mb-4">
                                <div className="flex gap-4 items-center">
                                    <div className="modal-avatar">
                                        {player.photo ? <img alt="" src={player.photo} /> : <i className="fas fa-user text-3xl text-white/30"></i>}
                                    </div>
                                    <div>
                                        <h2 className="modal-name">{player.name}</h2>
                                        <div className="flex items-center gap-3 mt-1">
                                            <span className="flex items-center gap-1 text-xs text-gray-400"><span className="font-bold text-gray-300">SM</span> <Stars count={player.skillMoves}/></span>
                                            <span className="flex items-center gap-1 text-xs text-gray-400"><span className="font-bold text-gray-300">PM</span> <Stars count={player.weakFoot}/></span>
                                        </div>
                                    </div>
                                </div>
                                <button onClick={onClose} className="w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-gray-400"><i className="fas fa-times"></i></button>
                            </div>
                            
                            <div className="segmented-control">
                                {player.positions.map((p, idx) => (
                                    <div key={idx} className={`segment-btn ${activePosIdx === idx ? 'active' : ''}`} onClick={() => setActivePosIdx(idx)}>
                                        {p.position} ({p.report.ovr})
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Body */}
                        <div className="p-5 space-y-6">
                            {/* Analysis */}
                            <div className="flex flex-col sm:flex-row gap-4 items-start">
                                <div className="w-full sm:w-1/3">
                                    <div className="ios-card p-4 text-center h-full flex flex-col justify-center">
                                        <div className={`text-6xl font-black font-display italic leading-none ${getOvrClass(ovr)} mb-1`}>{ovr}</div>
                                        <div className="text-xs font-bold text-gray-400 uppercase tracking-widest">{pos.position}</div>
                                        <div className="mt-3 inline-block">
                                            <span className={`arch-badge ${pos.report.archData.bg}`}>
                                                <i className={`fas ${pos.report.archData.icon}`}></i> {pos.report.archetype}
                                            </span>
                                        </div>
                                        <div className="text-[10px] text-gray-500 mt-2 font-semibold">Rol: {pos.report.role}</div>
                                        <div className="mt-3 flex justify-center"><RadarChart stats={stats} size={96} /></div>
                                        { (getRole() === 'admin' || getRole() === 'capitan') && pos.rating > 0 && (
                                            <div className="mt-3 flex justify-center">
                                                <Stars count={pos.rating} max={5} size="text-sm" />
                                            </div>
                                        )}
                                    </div>
                                </div>
                                <div className="w-full sm:w-2/3 ios-card p-4">
                                    <h3 className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3 border-b border-white/5 pb-2">Atributos Principales</h3>
                                    <div className="grid grid-cols-2 gap-x-4 gap-y-3">

        // ===== MAIN APP COMPONENT =====
        const MainApp = ({ onLogout }) => {

            // Squad Filters
            const [filters, setFilters] = useState({ posGroup: 'all', minSkill: 0, minWF: 0, playstyle: '', sortBy: 'ovr-desc' });
            const [searchQuery, setSearchQuery] = useState('');

            }, [showToast]);
            useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [chatHistory, isChatLoading]);

            const handleImageUpload = useCallback((e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onloadend = () => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 256;
                        let w = img.width, h = img.height;
                        if(w > h) { if(w > MAX_SIZE) { h *= MAX_SIZE/w; w = MAX_SIZE; } } 
                        else { if(h > MAX_SIZE) { w *= MAX_SIZE/h; h = MAX_SIZE; } }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        setForm(p => ({...p, photo: canvas.toDataURL('image/jpeg', 0.8)}));
                    };
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            }, []);

            const resetForm = useCallback(() => {
                setEditingId(null); setFormPosIndex(-1);
                setForm({ name: '', photo: null, skillMoves: 3, weakFoot: 3, currentPos: { position: 'DC', notes: '', rating: 0, pros: '', cons: '', psGold: [], psSilver: [], attributes: getDefaultAttrs() } });

            // Form Handlers

                setForm(p => {

                    if (isGold) { c.psGold = c.psGold.filter(x => x !== ps); }
                    else if (isSilver) { c.psSilver = c.psSilver.filter(x => x !== ps); if (c.psGold.length < 4) c.psGold.push(ps); }

                    return { ...p, currentPos: c };

            const saveForm = useCallback((e, continueAdding = false) => {
                e.preventDefault();

                const posToSave = { ...form.currentPos, report: r };

            const OCR = useCallback(async (e) => {

                    const sys = `Extrae TODOS los atributos de esta pantalla de FC 25/26. Devuelve SOLO JSON con sub-stats: {"pac":{"acceleration":80,"sprintSpeed":85},"sho":{"attPosition":75,"finishing":82,"shotPower":80,"longShots":70,"volleys":65,"penalties":72},"pas":{"vision":80,"crossing":75,"fkAcc":65,"shortPass":82,"longPass":78,"curve":70},"dri":{"agility":80,"balance":75,"reactions":82,"ballControl":85,"dribbling":83,"composure":78},"def":{"interceptions":50,"headingAcc":60,"defAware":45,"standTackle":40,"slideTackle":35},"phy":{"jumping":70,"stamina":80,"strength":75,"aggression":65}}. Si no ves algún sub-stat individual, estima un valor razonable basado en el stat principal del grupo. SOLO devuelve JSON, nada más.`;
                    const res = await callIA(sys, "Extrae atributos", imageData, { json: true });

            // Tactics Engine

                // Weak foot filter
                if (filters.minWF > 0) {
                    result = result.filter(p => parseInt(p.weakFoot) >= filters.minWF);
                }

                // PlayStyle filter
                if (filters.playstyle) {
                    result = result.filter(p => p.positions.some(pos =>
                        pos.psGold.includes(filters.playstyle) || pos.psSilver.includes(filters.playstyle)
                    ));
                }

                // Sorting
                const getBestOvr = (p) => Math.max(...p.positions.map(pos => pos.report.ovr));
                const getStatVal = (p, stat) => {
                    const bestPos = p.positions.reduce((a, b) => a.report.ovr > b.report.ovr ? a : b);
                    return calcMainStats(bestPos.attributes)[stat] || 0;
                };

                switch(filters.sortBy) {
                    case 'ovr-desc': result.sort((a,b) => getBestOvr(b) - getBestOvr(a)); break;
                    case 'ovr-asc': result.sort((a,b) => getBestOvr(a) - getBestOvr(b)); break;
                    case 'name-asc': result.sort((a,b) => a.name.localeCompare(b.name)); break;
                    case 'name-desc': result.sort((a,b) => b.name.localeCompare(a.name)); break;
                    case 'pac': result.sort((a,b) => getStatVal(b,'pac') - getStatVal(a,'pac')); break;
                    case 'sho': result.sort((a,b) => getStatVal(b,'sho') - getStatVal(a,'sho')); break;
                    case 'pas': result.sort((a,b) => getStatVal(b,'pas') - getStatVal(a,'pas')); break;
                    case 'dri': result.sort((a,b) => getStatVal(b,'dri') - getStatVal(a,'dri')); break;
                    case 'def': result.sort((a,b) => getStatVal(b,'def') - getStatVal(a,'def')); break;
                    case 'phy': result.sort((a,b) => getStatVal(b,'phy') - getStatVal(a,'phy')); break;
                }

                return result;
            }, [players, filters, searchQuery]);

                const groupPositions = POS_GROUPS[filters.posGroup];

                                            <div><h3 className="font-black text-white">Jogga Bonito App</h3><p className="text-[10px] text-green-400 font-bold">{isChatLoading ? 'Pensando...' : 'Online'}</p></div>
                                        </div>
                                        <button onClick={clearChat} className="text-gray-500 hover:text-red-400 transition-colors text-xs" title="Limpiar chat"><i className="fas fa-trash-can"></i></button>
                                    </div>
                                    <div className="chat-messages bg-black/20">
                                        {chatHistory.map((m,i) => (
                                            <div key={i} className={`flex ${m.role==='user'?'justify-end':'justify-start'}`}>
                                                <div className={`chat-bubble ${m.role==='user'?'chat-bubble-user':'chat-bubble-ai'}`}>{m.text.split('\n').map((l,j)=><span key={j}>{l}<br/></span>)}</div>
                                            </div>
                                        ))}
                                        {isChatLoading && <TypingIndicator />}
                                        <div ref={chatEndRef}></div>
                                    </div>
                                    <div className="p-3 border-t border-white/5 flex gap-2" style={{background:'var(--bg-elevated)'}}>
                                        <input type="text" value={chatInp} onChange={e=>setChatInp(e.target.value)} onKeyDown={e=>{if(e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }}} className="ios-input flex-1" placeholder="Pregunta sobre tu equipo..." disabled={isChatLoading} maxLength="500" />
                                        <button onClick={sendChat} disabled={isChatLoading || !chatInp.trim()} className="ios-btn !px-4"><i className={`fas ${isChatLoading?'fa-spinner fa-spin':'fa-paper-plane'}`}></i></button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ===== ADMIN TAB ===== */}
                        {activeTab === 'admin' && role === 'admin' && (
                            <div className="ios-card overflow-hidden p-6">
                                <h3 className="text-xl font-bold mb-4 text-white"><i className="fas fa-users-cog mr-2 text-yellow-500"></i>Panel de Administración</h3>
                                <div className="max-w-md bg-white/5 p-4 rounded-xl border border-white/10">
                                    <h4 className="font-semibold mb-3 text-sm text-gray-300">Crear Nuevo Usuario</h4>
                                    <form onSubmit={async (e) => {
                                        e.preventDefault();
                                        const u = e.target.newUser.value; const p = e.target.newPass.value; const r = e.target.newRole.value;
                                        try {
                                            const res = await apiFetch('/api/users', { method: 'POST', body: JSON.stringify({username:u,password:p,role:r}) });
                                            const data = await res.json().catch(() => ({}));
                                            if(data.success) { showToast('Usuario creado exitosamente'); e.target.reset(); }
                                            else showToast(data.error || 'Error al crear usuario');
                                        } catch(err) { showToast('Error de red'); }
                                    }} className="flex flex-col gap-3">
                                        <input name="newUser" type="text" placeholder="Nombre de usuario (3-24 caracteres)" className="ios-input" required minLength={3} maxLength={24} autoComplete="off" />
                                        <input name="newPass" type="password" placeholder="Contraseña (mínimo 8 caracteres)" className="ios-input" required minLength={8} maxLength={128} autoComplete="new-password" />
                                        <select name="newRole" className="ios-input" defaultValue="user">
                                            <option value="user">Usuario (Jugador)</option>
                                            <option value="capitan">Capitán</option>
                                            <option value="admin">Administrador</option>
                                        </select>
                                        <button type="submit" className="ios-btn mt-2">Crear Usuario</button>
                                    </form>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const App = () => {
            const [isAuthenticated, setIsAuthenticated] = useState(() => !!getSession());
            const [loginError, setLoginError] = useState('');
            const [loginLoading, setLoginLoading] = useState(false);
            const [showPass, setShowPass] = useState(false);

            // El servidor respondió 401 (sesión caducada o inválida): volver al login.
            useEffect(() => {
                const onExpired = () => { setIsAuthenticated(false); setLoginError('Tu sesión expiró. Vuelve a iniciar sesión.'); };
                window.addEventListener(AUTH_EXPIRED_EVENT, onExpired);
                return () => window.removeEventListener(AUTH_EXPIRED_EVENT, onExpired);
            }, []);

            // Cierra la sesión sola cuando el token caduque con la app abierta.
            useEffect(() => {
                if (!isAuthenticated) return;
                const session = getSession();
                if (!session) { clearSession(); setIsAuthenticated(false); return; }
                const ms = Math.min(session.exp * 1000 - Date.now(), 2147483647);
                const t = setTimeout(() => { clearSession(); setIsAuthenticated(false); setLoginError('Tu sesión expiró. Vuelve a iniciar sesión.'); }, Math.max(ms, 0));
                return () => clearTimeout(t);
            }, [isAuthenticated]);
            
            const handleLogout = () => {
                clearSession();
                setIsAuthenticated(false);
            };

            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen flex items-center justify-center font-sf relative" 
                         style={{background: `url('fondo.jpg') center/cover no-repeat fixed`}}>
                        <div className="login-bg"></div>
                        <div className="relative z-10 w-full max-w-md mx-4">
                            <div className="text-center mb-8">
                                <div className="login-logo"><i className="fas fa-futbol"></i></div>
                                <h1 className="login-title">JOGGA <span>BONITO</span></h1>
                                <p className="login-kicker">FC 27 · Pro Clubs</p>
                            </div>
                            <div className="login-card">
                                {loginError && (
                                    <div className="mb-4 p-3 rounded-lg flex items-center gap-2 text-sm font-bold" 
                                         style={{background:'rgba(255,69,58,0.1)', border:'1px solid rgba(255,69,58,0.2)', color:'#FF6B6B'}}>
                                        <i className="fas fa-exclamation-circle"></i>{loginError}
                                    </div>
                                )}
                                <form onSubmit={async (e) => {
                                    e.preventDefault();
                                    if (loginLoading) return;
                                    setLoginError('');
                                    setLoginLoading(true);
                                    const u = e.target.u.value; const p = e.target.p.value;
                                    try {
                                        const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({username:u,password:p}) });
                                        const data = await res.json().catch(() => ({}));
                                        if(data.success) {
                                            localStorage.setItem('jogga_token', data.token);
                                            localStorage.removeItem('jogga_role');
                                            setIsAuthenticated(true);
                                        } else {
                                            setLoginError(data.error || 'Credenciales incorrectas');
                                        }
                                    } catch(err) {
                                        setLoginError('Error de red al conectar con el servidor.');
                                    }
                                    setLoginLoading(false);
                                }} className="flex flex-col gap-4">
                                    <div>
                                        <label className="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1.5 block">Usuario</label>
                                        <input name="u" type="text" placeholder="gamertag" className="ios-input" required autoComplete="username" />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1.5 block">Contraseña</label>
                                        <div className="relative">
                                            <input name="p" id="loginPass" type={showPass ? 'text' : 'password'} placeholder="••••••••" className="ios-input" required autoComplete="current-password" />
                                            <button type="button" aria-label={showPass ? 'Ocultar contraseña' : 'Mostrar contraseña'} onClick={() => setShowPass(v => !v)} className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-600 hover:text-gray-400"><i className={`fas ${showPass ? 'fa-eye-slash' : 'fa-eye'}`}></i></button>
                                        </div>
                                    </div>
                                    <button type="submit" disabled={loginLoading} className="ios-btn w-full !text-base mt-2">
                                        {loginLoading
                                            ? <><i className="fas fa-spinner fa-spin mr-2"></i>Conectando...</>
                                            : <><i className="fas fa-sign-in-alt mr-2"></i>Entrar al Vestuario</>}
                                    </button>
                                </form>
                                <p className="text-center text-xs text-gray-600 mt-4">
                                    ¿No tienes cuenta? <span className="text-emerald-500 font-bold cursor-pointer hover:underline">Pide una cuenta al Administrador</span>
                                </p>
                            </div>
                        </div>
                    </div>
                );
            }
            
            return <MainApp onLogout={handleLogout} />;
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
